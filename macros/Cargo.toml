[package]
name = "superset-function-sdk-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Newboot <dev@newboot.io>"]
description = "Procedural macros for superset-function-sdk."
license = "Apache-2.0"
repository = "https://github.com/Newboot-io/superset-function-sdk-rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
