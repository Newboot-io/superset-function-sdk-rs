[package]
name = "superset-function-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Newboot <dev@newboot.io>"]
description = "Write a Newboot MQ Function in Rust over wasm-graph:processor@1.1.0."
license = "Apache-2.0"
repository = "https://github.com/Newboot-io/superset-function-sdk-rs"
readme = "README.md"
keywords = ["newboot", "superset", "wasm", "iot", "mqtt"]
categories = ["wasm", "network-programming"]

[lib]
name = "newboot"

[workspace]
members = [
  ".",
  "macros",
  "template",
  "examples/rename-convert",
  "examples/uns-topic",
  "examples/drop-below",
  "examples/running-average",
  "examples/rule-mapper",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superset-function-sdk = { path = "." }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
superset-function-sdk-macros = { path = "macros", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Speed, not size: Newboot MQ meters instructions (fuel), and opt-level "z" uses more fuel.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
